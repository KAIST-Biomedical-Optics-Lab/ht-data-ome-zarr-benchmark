# Error-bounded codec benchmark figures (HTPackFourier, SZ3, SPERR at 0.99e-4) together with
# the lossless / BitRound / FixedScaleOffset results of the original benchmark.
#   - Tables: built by 03_visualization/execution-example/run-errorbounded-report.ps1 (merge step)
#   - Overall / filter / bottleneck: visualize_benchmark.py --config 03_visualization/config/benchmark_errorbounded.toml
#   - Method comparison ([htpack] section): visualize_htpack.py --config (same file)
# SPERR_G99-1 = SPERR pwe mode, eps = 0.99e-4 (SPERR-1 rows at eps = 1e-4 fail the 1e-4 check and are not shown).

[general]
output_dir = "figure"
overall_subdir = "view-bench-1-overall-errorbounded"
filter_subdir = "view-bench-3-filter-errorbounded"
bottleneck_subdir = "view-bench-5-bottlneck-errorbounded"

[datasets]
bacteria = { name = "Bacteria", path = "output/merged-bacteria-8G-errorbounded.csv" }
HeLa = { name = "HeLa", path = "output/merged-HeLa-8G-errorbounded.csv" }
embryo = { name = "Embryo", path = "output/merged-embryo-8G-errorbounded.csv" }
organoid = { name = "Organoid", path = "output/merged-organoid-8G-errorbounded.csv" }
tissue-on = { name = "Tissue (on-diagonal)", path = "output/merged-tissue-on-8G-errorbounded.csv" }

[compression_options]
gzip = [1, 5, 9]
zlib = [1, 5, 9]
bzip2 = [1, 5, 9]
lzma = [1, 5, 9]
lz4 = [1]
Snappy = [0]
zstd = [1, 11, 22]
PCodec = [0, 6, 12]
blosc-zlib = [1, 5, 9]
blosc-lz4 = [1, 5, 9]
blosc-zstd = [1, 5, 9]
LOSSLESS_ZFP = [0]
LOSSY_ZFP = [0]
HTPackFourier = [1]
SZ3 = [1]
SPERR_G99 = [1]

[filter_options]
names = ["none", "Shuffle", "BitRound-14", "BitRound-14-Shuffle", "FixedScaleOffset", "FixedScaleOffset-Shuffle-2"]
throughput_names = ["Shuffle", "none"]

[filter_display_colors]
none = ["#1f78b4", "#63a3cc", "#a6cee3"]
Shuffle = ["#33a02c", "#73c05b", "#b2df8a"]
BitRound-14 = ["#e31a1c", "#ef5a5b", "#fb9a99"]
BitRound-14-Shuffle = ["#ff7f00", "#fe9f38", "#fdbf6f"]
FixedScaleOffset = ["#6a3d9a", "#9a77b8", "#cab2d6"]
FixedScaleOffset-Shuffle-2 = ["#b15928", "#d08a5f", "#e8bfa0"]

[defaults.axis_limits]
"compression ratio" = { ylim = [1.0, 16.0], yscale = "linear" }
"compression speed (bytes/sec)" = { ylim = [10000000.0, 3162277660.2], yscale = "log" }
"decompression speed (bytes/sec)" = { ylim = [10000000.0, 3162277660.2], yscale = "log" }

[bottleneck]
base_transfer_rate_range = [18, 36, 3]
exclude_compressors = ["none", "Nvcomp", "Zlibng"]
# rows are grouped by compressor only, so filtered variants of the same compressor are excluded
exclude_filters = ["BitRound", "FixedScaleOffset"]
# error-bounded codecs carry filter "none" (Squeeze renamed at merge); SPERR_G99 excludes the failing SPERR-1 rows
none_filter_compressors = ["PCodec", "ZFP", "HTPackFourier", "SZ3", "SPERR_G99"]

# ---------------------------------------------------------------------------
# Method comparison (visualize_htpack.py)
# ---------------------------------------------------------------------------
[htpack]
fso_subdir = "view-bench-errorbounded-comparison"

[[htpack.fso_comparison]]
compression = "HTPackFourier-1"
filter = "none"
label = "HTPackFourier (eps=1e-4)"
color = "#8e44ad"

[[htpack.fso_comparison]]
compression = "SZ3-1"
filter = "none"
label = "SZ3 (abs 1e-4)"
color = "#16a085"

[[htpack.fso_comparison]]
compression = "SPERR_G99-1"
filter = "none"
label = "SPERR (pwe 0.99e-4)"
color = "#2c3e50"

[[htpack.fso_comparison]]
compression = "PCodec-6"
filter = "BitRound-14"
label = "PCodec-6 + BitRound-14"
color = "#95a5a6"

[[htpack.fso_comparison]]
compression = "zstd-1"
filter = "FixedScaleOffset-Shuffle-2"
label = "zstd-1 + FSO + Shuffle-2"
color = "#2980b9"

[[htpack.fso_comparison]]
compression = "PCodec-6"
filter = "FixedScaleOffset"
label = "PCodec-6 + FSO"
color = "#27ae60"

[[htpack.fso_comparison]]
compression = "PCodec-12"
filter = "FixedScaleOffset"
label = "PCodec-12 + FSO"
color = "#1e8449"
